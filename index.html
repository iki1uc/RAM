<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RAM · Axiom‑1 · Hardware‑Sequencer</title>

<style>
body { background:#000; color:#0ff; font-family:monospace; padding:40px; }
.ram { border:2px solid #0ff; padding:20px; width:520px; }
.stat { margin-top:20px; color:#0f0; }
.ax { margin-top:20px; color:#ff0; }
button { background:#0f0; color:#000; padding:10px 20px; border:none; cursor:pointer; }
</style>
</head>

<body>

<h2>RAM · Axiom‑1 · 4‑Wertigkeiten‑Sequencer</h2>

<div class="ram">
    <div>ID: RAM‑AXIOM‑1</div>
    <div>Modus: 4all</div>
    <div>Status: aktiv</div>

    <div class="stat" id="block">BLOCK: 0</div>
    <div class="stat" id="cache">CACHE: 0</div>
    <div class="stat" id="flow">FLOW: 0</div>
    <div class="stat" id="state">STATE: 1.0</div>

    <div class="ax">
        <h3>Hardware‑Axiome</h3>
        <pre id="axioms"></pre>
    </div>
</div>

<button onclick="runCycle()">RAM‑Zyklus</button>

<script type="module">
import { RAMModule } from "./RAM.module.js";
import { loadHardwareAxioms } from "./RAM.hardware.js";

const ram = new RAMModule();

async function init(){
    const axioms = await loadHardwareAxioms();
    document.getElementById("axioms").innerText =
        JSON.stringify(axioms, null, 2);
}
init();

function runCycle(){
    const snap = ram.cycle();
    document.getElementById("block").innerText = "BLOCK: " + snap.block;
    document.getElementById("cache").innerText = "CACHE: " + snap.cache;
    document.getElementById("flow").innerText  = "FLOW: " + snap.flow.toFixed(4);
    document.getElementById("state").innerText = "STATE: " + snap.state.toFixed(4);
}
</script>

</body>
</html>
